[project]
name = "nhanes-mcp"
version = "0.3.0"
description = "MCP server for design-correct, conversational access to NHANES public-use data (Black Swan Causal Labs)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=1.2,<2", "pandas>=2.0", "numpy", "scipy", "pyreadstat", "httpx", "beautifulsoup4", "lxml"]

[project.scripts]
nhanes-mcp = "nhanes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
